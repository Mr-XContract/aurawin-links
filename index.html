<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURAWIN — Enlaces oficiales</title>
<meta name="description" content="Todos los canales oficiales de AURAWIN en un solo lugar.">
<style>
  :root{--bg:#07090b;--g1:#C6FF3D;--g2:#39FF88;--g3:#00E0A8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background-image:radial-gradient(60% 40% at 50% 0%,rgba(57,255,136,.16),transparent);display:flex;justify-content:center;padding:48px 16px}
  main{width:100%;max-width:440px}
  .logo{width:80px;height:80px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:32px;font-weight:900;color:var(--bg);
    background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 0 30px -4px rgba(57,255,136,.6)}
  h1{margin:20px 0 4px;text-align:center;font-size:30px;letter-spacing:.06em;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{text-align:center;color:rgba(255,255,255,.6);font-size:14px;margin:0 0 32px}
  nav{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.2s}
  a.btn:hover{border-color:rgba(57,255,136,.45);background:rgba(255,255,255,.07)}
  a.btn.primary{color:var(--bg);border:0;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 0 30px -8px rgba(57,255,136,.7)}
  a.btn.primary:hover{transform:scale(1.02)}
  svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .t{flex:1}.t b{display:block;font-weight:600}.t small{display:block;font-size:12px;opacity:.6;margin-top:2px}
  footer{margin-top:40px;text-align:center;font-size:11px;line-height:1.6;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<main>
  <div class="logo" id="logo"></div>
  <h1 id="name"></h1>
  <p class="tag" id="tag"></p>
  <nav id="links"></nav>
  <footer id="disc"></footer>
</main>
<script src="config.js"></script>
<script>
  var ICONS={
    web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
    telegram:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
    whatsapp:'<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5A8.5 8.5 0 1 1 21 11.5z"/>',
    instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>'
  };
  var c=window.HUB_CONFIG;
  document.getElementById('logo').textContent=c.name.charAt(0);
  document.getElementById('name').textContent=c.name;
  document.getElementById('tag').textContent=c.tagline;
  document.getElementById('disc').textContent=c.disclaimer;
  var nav=document.getElementById('links');
  c.links.filter(function(l){return l.href}).forEach(function(l){
    var a=document.createElement('a');
    a.className='btn'+(l.primary?' primary':'');
    a.href=l.href;a.target='_blank';a.rel='noopener noreferrer';
    a.innerHTML='<svg viewBox="0 0 24 24">'+(ICONS[l.icon]||ICONS.web)+'</svg><span class="t"><b></b><small></small></span>';
    a.querySelector('b').textContent=l.label;
    a.querySelector('small').textContent=l.desc;
    nav.appendChild(a);
  });
</script>
</body>
</html>
