<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURAWIN — Enlaces oficiales</title>
<link rel="icon" href="logo.webp">
<meta name="description" content="Todos los canales oficiales de AURAWIN en un solo lugar.">
<style>
  :root{--bg:#07090b;--g1:#C6FF3D;--g2:#39FF88;--g3:#00E0A8}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background-image:radial-gradient(60% 40% at 50% 0%,rgba(57,255,136,.16),transparent);display:flex;justify-content:center;padding:48px 16px}
  main{width:100%;max-width:440px}
  .logo{display:block;width:96px;height:96px;border-radius:50%;margin:0 auto;box-shadow:0 0 36px -6px rgba(57,255,136,.55)}
  h1{margin:20px 0 4px;text-align:center;font-size:30px;letter-spacing:.06em;background:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));-webkit-background-clip:text;background-clip:text;color:transparent}
  .tag{text-align:center;color:rgba(255,255,255,.6);font-size:14px;margin:0 0 32px}
  nav{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:16px;padding:16px;border-radius:16px;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);transition:.2s}
  a.btn:hover{border-color:rgba(57,255,136,.45);background:rgba(255,255,255,.07)}
  a.btn.primary{color:var(--bg);border:0;background:linear-gradient(135deg,var(--g1),var(--g2) 55%,var(--g3));box-shadow:0 0 30px -8px rgba(57,255,136,.7)}
  a.btn.primary:hover{transform:scale(1.02)}
  svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .t{flex:1}.t b{display:block;font-weight:600}.t small{display:block;font-size:12px;opacity:.6;margin-top:2px}
  #dbg{margin-top:24px;padding:12px 14px;border-radius:12px;border:1px dashed rgba(255,255,255,.25);font-size:12px;color:rgba(255,255,255,.7)}
  #dbg b{color:var(--g2)}#dbg div{display:flex;justify-content:space-between;padding:2px 0}
  footer{margin-top:40px;text-align:center;font-size:11px;line-height:1.6;color:rgba(255,255,255,.4)}
</style>
</head>
<body>
<main>
  <img class="logo" id="logo" src="logo.webp" alt="Logo AURAWIN" width="96" height="96">
  <h1 id="name"></h1>
  <p class="tag" id="tag"></p>
  <nav id="links"></nav>
  <div id="dbg" hidden></div>
  <footer id="disc"></footer>
</main>
<script src="config.js"></script>
<script>
  var ICONS={
    web:'<circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/>',
    telegram:'<path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/>',
    whatsapp:'<path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 20.5l1.7-5A8.5 8.5 0 1 1 21 11.5z"/>',
    x:'<path d="M4 4l16 16M20 4L4 20"/>',
    mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
    instagram:'<rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r=".6"/>'
  };
  var c=window.HUB_CONFIG;
  document.getElementById('name').textContent=c.name;
  document.getElementById('tag').textContent=c.tagline;
  document.getElementById('disc').textContent=c.disclaimer;
  var nav=document.getElementById('links');
  var cfgA=(c.analytics||{}).goatcounter;

  // Conteo externo (GoatCounter). Solo se carga si hay código configurado.
  if(cfgA){
    window.goatcounter={no_onload:true,endpoint:'https://'+cfgA+'.goatcounter.com/count'};
    var s=document.createElement('script');s.async=true;s.src='https://gc.zgo.at/count.js';
    s.onload=function(){window.goatcounter.count({path:'hub',title:'Vista del hub'})};
    document.head.appendChild(s);
  }

  // Contador local (modo debug) para comprobar que cada botón cuenta.
  function localTally(id){
    try{
      var t=JSON.parse(localStorage.getItem('hub_clicks')||'{}');
      t[id]=(t[id]||0)+1;localStorage.setItem('hub_clicks',JSON.stringify(t));
    }catch(e){}
    renderDebug();
  }
  function renderDebug(){
    if(!c.debug)return;
    var box=document.getElementById('dbg'),t={};
    try{t=JSON.parse(localStorage.getItem('hub_clicks')||'{}')}catch(e){}
    box.hidden=false;box.innerHTML='<b>Clics en este navegador (prueba)</b>';
    c.links.forEach(function(l){
      if(!l.href)return;
      var r=document.createElement('div');
      r.innerHTML='<span></span><b></b>';
      r.firstChild.textContent=l.label;r.lastChild.textContent=t[l.id]||0;
      box.appendChild(r);
    });
  }

  function track(l){
    if(window.goatcounter&&window.goatcounter.count){
      window.goatcounter.count({path:'click/'+l.id,title:l.label,event:true});
    }
    localTally(l.id);
  }

  function withUtm(href,id){
    try{
      var u=new URL(href);var m=c.utm||{};
      u.searchParams.set('utm_source',m.source||'hub');
      u.searchParams.set('utm_medium',m.medium||'linkinbio');
      u.searchParams.set('utm_campaign',id);
      return u.toString();
    }catch(e){return href}
  }

  c.links.filter(function(l){return l.href}).forEach(function(l){
    var a=document.createElement('a');
    a.className='btn'+(l.primary?' primary':'');
    a.href=l.utm?withUtm(l.href,l.id):l.href;
    if(/^https?:/.test(a.href)){a.target='_blank';a.rel='noopener noreferrer'}
    a.innerHTML='<svg viewBox="0 0 24 24">'+(ICONS[l.icon]||ICONS.web)+'</svg><span class="t"><b></b><small></small></span>';
    a.querySelector('b').textContent=l.label;
    a.querySelector('small').textContent=l.desc;
    a.addEventListener('click',function(){track(l)});
    nav.appendChild(a);
  });
  renderDebug();
</script>
</body>
</html>
